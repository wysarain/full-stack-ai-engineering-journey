<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login form with CSS" />
    <title>Login Form with the CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Making the login form -->
     <div  class="form">
    <div class="input">
      <h2>Login Here</h2>
      <input 
        type="text"
        id="username"
        placeholder="Enter you username"
        required
        maxlength="30"
      />
      <input
        type="password"
        id="password"
        placeholder="Enter your Password"
        required
        minlength="8"
      />
    </div>
    <div>
      <button type="submit">    login</button>
      <p>Login with</p>
      <button type="button">Google</button>
      <button type="button">Facebook</button>
    </div>
    <div>
      <p>Not a member? <a href="signup.html"> Sign up here </a></p>
    </div>
     </div>
  </body>
</html>
